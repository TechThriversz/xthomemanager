<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Access Revoked</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f7fc;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(26,42,68,0.08);
        }

        .header {
            background: #FF6B6B;
            padding: 30px;
            text-align: center;
            color: white;
        }

            .header h1 {
                margin: 0;
                font-size: 24px;
            }

        .content {
            padding: 40px 30px;
            color: #333;
        }

            .content p {
                font-size: 16px;
                line-height: 1.7;
                color: #555;
                margin: 16px 0;
            }

        .footer {
            text-align: center;
            padding: 30px;
            background: #f9f9f9;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Access Update</h1>
        </div>
        <div class="content">
            <p>Hello <strong>{{FullName}}</strong>,</p>
            <p>Your access to <strong>"{{record_name}}"</strong> has been <strong>revoked</strong> by the owner.</p>
            <p>If this was unexpected, please contact them directly.</p>
        </div>
        <div class="footer">
            <p>© 2025 XT Home Manager</p>
        </div>
    </div>
</body>
</html>
