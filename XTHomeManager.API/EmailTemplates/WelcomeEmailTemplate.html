<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Welcome to XT Home Manager</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f7fc;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(26,42,68,0.08);
        }

        .header {
            background: linear-gradient(135deg, #1A2A44, #2C3E50);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

            .header h1 {
                margin: 0;
                font-size: 28px;
                font-weight: 700;
            }

        .content {
            padding: 40px 30px;
            color: #333;
        }

            .content p {
                font-size: 16px;
                line-height: 1.7;
                color: #555;
                margin: 16px 0;
            }

        .btn {
            display: inline-block;
            background: #1A2A44;
            color: white;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin: 20px 0;
        }

        .footer {
            text-align: center;
            padding: 30px;
            background: #f9f9f9;
            color: #888;
            font-size: 14px;
        }

        .highlight {
            background: #E9F1FC;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>XT Home Manager</h1>
        </div>
        <div class="content">
            <p>Hello <strong>{{FullName}}</strong>,</p>
            <p>Welcome! Your account is ready. Track milk, rent, bills, and home expenses — all in one beautiful app.</p>
            <div class="highlight">
                <p><strong>Pro Tip:</strong> Create your first record in under 30 seconds!</p>
            </div>
            <div style="text-align: center;">
                <a href="https://xthomemanager.vercel.app" class="btn">Open Dashboard</a>
            </div>
            <p>Need help? We're here 24/7.</p>
        </div>
        <div class="footer">
            <p>© 2025 XT Home Manager. Made with love in Pakistan</p>
        </div>
    </div>
</body>
</html>
