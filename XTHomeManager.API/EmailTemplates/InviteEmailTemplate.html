<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>You're Invited!</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333;">
    <h2>Hello {{Name}},</h2>
    <p><strong>{{InviterName}}</strong> has invited you to view the record:</p>
    <h3 style="color: #1A2A44;">{{RecordName}}</h3>

    {{#if IsNewUser}}
    <div style="background: #FFF6F5; padding: 15px; border-radius: 8px; margin: 20px 0;">
        <p><strong>Your temporary password:</strong></p>
        <p style="font-size: 18px; font-weight: bold; color: #D9534F;">{{TempPassword}}</p>
        <p><em>Please change it after logging in.</em></p>
    </div>
    {{else}}
    <p>You already have an account. Log in to accept the invite.</p>
    {{/if}}

    <a href="https://xthomemanager.vercel.app" style="background: #1A2A44; color: white; padding: 12px 24px; text-decoration: none; border-radius: 8px; display: inline-block; margin-top: 20px;">
        Open App
    </a>
</body>
</html>
