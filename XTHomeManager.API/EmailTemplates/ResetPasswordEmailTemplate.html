<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reset Your Password</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f7fc;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(26,42,68,0.08);
        }

        .header {
            background: #FF6B6B;
            padding: 30px;
            text-align: center;
        }

            .header h1 {
                margin: 0;
                color: white;
                font-size: 24px;
            }

        .content {
            padding: 40px 30px;
            color: #333;
        }

            .content p {
                font-size: 16px;
                line-height: 1.7;
                color: #555;
                margin: 16px 0;
            }

        .btn {
            display: inline-block;
            background: #1A2A44;
            color: white;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin: 20px 0;
        }

        .warning {
            background: #FFF6F5;
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid #FF6B6B;
            margin: 20px 0;
        }

        .footer {
            text-align: center;
            padding: 30px;
            background: #f9f9f9;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Password Reset</h1>
        </div>
        <div class="content">
            <p>Hello <strong>{{FullName}}</strong>,</p>
            <p>We received a request to reset your password.</p>
            <div class="warning">
                <p><strong>Link expires in 1 hour.</strong> If you didn't request this, ignore this email.</p>
            </div>
            <div style="text-align: center;">
                <a href="{{ResetLink}}" class="btn">Reset Password</a>
            </div>
        </div>
        <div class="footer">
            <p>© 2025 XT Home Manager</p>
        </div>
    </div>
</body>
</html>
